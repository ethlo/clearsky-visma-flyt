# Runs this plugin's tests against Clearsky's main branch.
name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ethlo/clearsky
          path: .clearsky
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
        env:
          CLEARSKY_CORE: .clearsky
